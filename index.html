<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAE Widget Kit</title>
<style>
:root{
  --bg:#191919; --card:#202020; --fg:#e9e9e7; --muted:#9b9a97; --line:#2f2f2f; --soft:#2a2a2a; --invert:#191919;
  --serif: Lyon-Text, Georgia, "Times New Roman", ui-serif, serif;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
html[data-tema="terang"]{
  --bg:#ffffff; --card:#fbfbfa; --fg:#37352f; --muted:#787774; --line:#e9e9e7; --soft:#f1f1ef; --invert:#ffffff;
}
html[data-bg="transparan"], html[data-bg="transparan"] body{ background:transparent !important; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.kecil{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- kotak widget (dipakai mode embed & galeri) ---------- */
.wbox{position:relative;width:100%;height:100%;container-type:size;overflow:hidden}
.w{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5cqmin;padding:5cqmin;text-align:center}
.w.atas{justify-content:flex-start}
.btn{font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.utama{background:var(--fg);color:var(--invert);border-color:var(--fg)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.baris{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{font-family:var(--sans);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:transparent;cursor:pointer}
.chip.on{background:var(--soft);border-color:var(--muted)}
.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px}
.tab{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--fg);color:var(--invert)}
.inp{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
.inp:focus{border-color:var(--muted)}
.garis{width:100%;height:1px;background:var(--line)}

/* jam digital */
.jd-jam{font-size:24px;font-size:clamp(28px,min(34cqh,24cqw),220px);line-height:1;letter-spacing:-.02em}
.jd-detik{font-size:.38em;color:var(--muted);margin-left:.08em;vertical-align:.95em}
.jd-tgl{font-size:15px;font-size:clamp(12px,6cqmin,28px);font-style:italic}
/* jam analog */
.ja-svg{width:min(78cqmin,100%);height:auto;aspect-ratio:1}
/* ring timer */
.ring{position:relative;width:min(62cqmin,100%);aspect-ratio:1;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .angka{font-size:clamp(22px,15cqmin,110px);line-height:1}
.ring .sub{margin-top:.4em}
.titik{letter-spacing:.3em;color:var(--muted);font-size:14px}
.pesan{font-style:italic;color:var(--muted);min-height:1.3em;font-size:14px}
/* stopwatch */
.sw-angka{font-size:clamp(28px,20cqmin,150px);line-height:1}
.sw-cs{font-size:.45em;color:var(--muted)}
.laps{width:100%;max-width:340px;max-height:30cqh;overflow:auto;font-family:var(--sans);font-size:12px;color:var(--muted)}
.laps div{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px solid var(--line)}
/* kalkulator */
.kal{width:min(100%,360px);height:100%;display:flex;flex-direction:column;gap:8px;padding:12px}
.kal-layar{border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:right;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.kal-eks{font-family:var(--sans);font-size:13px;color:var(--muted);min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.kal-hasil{font-size:clamp(22px,9cqmin,44px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:0}
.kal-grid button{border:1px solid var(--line);background:transparent;border-radius:10px;font-size:clamp(14px,5cqmin,22px);cursor:pointer;min-height:30px}
.kal-grid button:hover{background:var(--soft)}
.kal-grid .op{font-family:var(--sans);color:var(--muted)}
.kal-grid .sama{background:var(--fg);color:var(--invert);border-color:var(--fg)}
/* kalender */
.kl{width:min(100%,420px);height:100%;display:flex;flex-direction:column;padding:12px;gap:8px}
.kl-head{display:flex;align-items:center;justify-content:space-between}
.kl-judul{font-size:clamp(16px,6cqmin,26px)}
.kl-nav{display:flex;gap:4px}
.kl-nav button{border:1px solid var(--line);background:transparent;border-radius:999px;width:28px;height:28px;cursor:pointer}
.kl-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:2px;min-height:0}
.kl-grid .h{font-family:var(--sans);font-size:10px;letter-spacing:.1em;color:var(--muted);display:grid;place-items:center;text-transform:uppercase}
.kl-grid .d{display:grid;place-items:center;font-size:clamp(12px,4.2cqmin,18px);border-radius:999px}
.kl-grid .lain{color:var(--muted);opacity:.45}
.kl-grid .mg{color:var(--muted)}
.kl-grid .ini{background:var(--fg);color:var(--invert)}
/* progres */
.pg{width:min(100%,460px);display:flex;flex-direction:column;gap:14px;padding:6px}
.pg-row{display:flex;flex-direction:column;gap:5px;text-align:left}
.pg-top{display:flex;justify-content:space-between;align-items:baseline}
.pg-lbl{font-size:clamp(13px,4.5cqmin,18px)}
.pg-bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.pg-bar i{display:block;height:100%;background:var(--fg);border-radius:99px}
/* hitung mundur */
.hm-label{font-size:clamp(14px,6cqmin,26px);font-style:italic}
.hm-besar{font-size:clamp(34px,28cqmin,190px);line-height:.95}
.form{display:flex;flex-direction:column;gap:8px;width:min(100%,320px);text-align:left}
.form label{display:flex;flex-direction:column;gap:4px}
.salin-box{display:flex;gap:6px;width:100%}
.salin-box input{flex:1;min-width:0;font-family:var(--sans);font-size:11px}
/* hitung kata */
.hk{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:12px}
.hk textarea{flex:1;min-height:60px;resize:none;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;font-size:14px;line-height:1.5}
.hk textarea:focus{border-color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:left}
.stat b{display:block;font-weight:400;font-size:clamp(16px,5.5cqmin,24px)}
/* kalkulator ip */
.ip{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:12px}
.ip-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.ip-row{display:grid;grid-template-columns:1fr 54px 92px 24px;gap:6px;align-items:center}
.ip-row input,.ip-row select{width:100%;min-width:0}
.ip-row .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
.ip-hasil{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:8px}
.ip-besar{font-size:clamp(26px,12cqmin,52px);line-height:1}
.catatan{font-family:var(--sans);font-size:10.5px;color:var(--muted);text-align:left;line-height:1.4}
/* acak kelompok */
.ak{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
@container (max-width:520px){ .ak{grid-template-columns:1fr} }
.ak-kiri{display:flex;flex-direction:column;gap:8px;min-height:0}
.ak-kiri textarea{flex:1;min-height:70px;resize:none;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;font-size:13px;line-height:1.45}
.ak-hasil{overflow:auto;min-height:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.ak-grup{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ak-grup h4{margin:0 0 4px;font-weight:400;font-style:italic}
.ak-grup div{font-family:var(--sans);font-size:12.5px;line-height:1.55}
.ak-terpilih{font-size:clamp(20px,9cqmin,40px);text-align:center;padding:10px}

/* ---------- galeri ---------- */
.galeri{max-width:1180px;margin:0 auto;padding:44px 22px 70px}
.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:22px}
.g-head h1{font-weight:400;font-size:clamp(34px,5vw,54px);margin:6px 0 6px;letter-spacing:-.01em}
.g-head p{margin:0;color:var(--muted);max-width:560px;line-height:1.55}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;margin-top:26px;align-items:start}
.kartu{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.kartu-top{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 0}
.kartu-top h3{margin:0;font-weight:400;font-size:19px}
.kartu-ket{padding:4px 16px 0;margin:0;font-size:13px;color:var(--muted);font-style:italic}
.kartu-prev{margin:12px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.kartu-bawah{padding:0 12px 14px;display:flex;flex-direction:column;gap:6px}
.cara{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.cara div{border-top:1px solid var(--line);padding-top:12px}
.cara b{font-weight:400;font-size:18px;display:block;margin-bottom:6px}
.cara p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
/* ---------- widget tambahan ---------- */
/* progres hari */
.ph{width:min(100%,520px);display:flex;flex-direction:column;gap:10px;text-align:left}
.ph-besar{font-size:clamp(30px,min(30cqh,18cqw),110px);line-height:1}
.ph-bar{height:clamp(8px,4cqh,16px);border-radius:99px;background:var(--soft);overflow:hidden}
.ph-bar i{display:block;height:100%;background:var(--fg);border-radius:99px;transition:width .6s}
.ph-skala{display:flex;justify-content:space-between}
/* jam pasir */
.jp-svg{height:min(56cqh,100%);width:auto;max-width:60cqw;transition:transform .6s ease}
.jp-svg.balik{transform:rotate(180deg)}
.jp-arus{stroke-dasharray:2 3;animation:jpArus .5s linear infinite}
@keyframes jpArus{to{stroke-dashoffset:-5}}
.jp-angka{font-size:clamp(18px,8cqmin,40px)}
/* kalkulator ilmiah */
.ki{width:min(100%,420px);height:100%;display:flex;flex-direction:column;gap:6px;padding:10px}
.ki-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;min-height:0}
.ki-grid button{border:1px solid var(--line);background:transparent;border-radius:9px;font-size:clamp(12px,4cqmin,18px);cursor:pointer;min-height:26px;padding:0}
.ki-grid button:hover{background:var(--soft)}
.ki-grid .fn{font-family:var(--sans);font-size:clamp(10px,3.2cqmin,14px);color:var(--muted)}
.ki-grid .op{font-family:var(--sans);color:var(--muted)}
.ki-grid .sama{background:var(--fg);color:var(--invert);border-color:var(--fg)}
.ki-grid .mode{font-family:var(--sans);font-size:10px;letter-spacing:.08em}
/* form kalkulator kecil (split bill, BMI, konverter) */
.fk{width:min(100%,440px);display:flex;flex-direction:column;gap:9px;text-align:left}
.fk-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fk-row.tiga{grid-template-columns:1fr 1fr 1fr}
.fk label{display:flex;flex-direction:column;gap:4px;min-width:0}
.fk label .inp{width:100%}
.fk-hasil{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.fk-besar{font-size:clamp(24px,10cqmin,46px);line-height:1}
.rinci{font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.6;text-align:right}
.fk label.cek,.cek{flex-direction:row;display:flex;align-items:center;white-space:nowrap;gap:6px;font-family:var(--sans);font-size:12px;color:var(--muted)}
.skala-bmi{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--soft) 0 17.5%,var(--muted) 17.5% 50%,var(--soft) 50% 60%,var(--line) 60% 100%)}
.skala-bmi i{position:absolute;top:-4px;width:2px;height:16px;background:var(--fg);transition:left .3s}
/* konverter */
.kv-io{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.kv-io .inp{width:100%}
.kv-tukar{border:1px solid var(--line);background:transparent;border-radius:999px;width:32px;height:32px;cursor:pointer;margin-bottom:2px}
.kv-hasil{font-size:clamp(20px,8cqmin,36px);word-break:break-all}
/* qr */
.qr{width:100%;height:100%;display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px;align-items:center}
@container (max-width:460px){ .qr{grid-template-columns:1fr} }
.qr-kiri{display:flex;flex-direction:column;gap:8px;height:100%;min-height:0}
.qr-kiri textarea{flex:1;min-height:60px;resize:none;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;font-size:13px}
.qr-gbr{background:#fff;border-radius:10px;padding:6px;display:grid;place-items:center;justify-self:center}
.qr-gbr svg{display:block;width:min(46cqh,46cqw,260px);height:auto;aspect-ratio:1}
@container (max-width:460px){ .qr-gbr svg{width:min(42cqh,70cqw,220px)} }
/* scratchpad */
.sp{width:100%;height:100%;display:flex;flex-direction:column}
.sp-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line)}
.sp-area{position:relative;flex:1;min-height:0}
.sp-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sp-area textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:none;background:transparent;padding:14px;font-size:15px;line-height:1.6;display:none}
.sp-dot{width:22px;height:22px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.sp-dot.on{border-color:var(--fg)}
.sp-dot i{display:block;border-radius:999px;background:var(--fg)}
/* kutipan */
.ku-teks{font-size:clamp(17px,min(9cqh,6.5cqw),36px);line-height:1.35;max-width:640px;font-style:italic}
.ku-teks::before{content:"\201C"}.ku-teks::after{content:"\201D"}
/* shortcut */
.sc{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:12px}
.sc-list{flex:1;overflow:auto;min-height:0;text-align:left}
.sc-list h4{margin:12px 0 4px;font-weight:400;font-style:italic;font-size:15px}
.sc-list h4:first-child{margin-top:0}
.sc-item{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:12.5px}
.sc-item span:first-child{color:var(--muted)}
kbd{font-family:var(--sans);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;white-space:nowrap;background:var(--soft)}
/* zona waktu */
.zw{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:12px}
.zw svg{width:100%;height:auto;display:block}
.zw-list{flex:1;overflow:auto;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;align-content:start}
.zw-kota{border:1px solid var(--line);border-radius:10px;padding:6px 9px;text-align:left;cursor:pointer;background:transparent}
.zw-kota.on{border-color:var(--fg)}
.zw-kota b{display:block;font-weight:400;font-size:18px}
/* galeri: judul kategori */
.g-kat{margin:38px 0 0;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.g-kat h2{margin:0;font-weight:400;font-size:24px}

code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--soft);padding:1px 5px;border-radius:5px}
/* ---------- v3 ---------- */
a.btn,a.chip{text-decoration:none;color:inherit;display:inline-block}
a.btn.utama{color:var(--invert)}
.chip.mati{opacity:.45}
.panel-atur{border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;max-width:440px}
.panel-atur label{display:inline-flex;align-items:center;gap:4px}
/* header hari ini */
.hh{width:100%;height:100%;display:grid;grid-template-columns:auto 1fr;gap:5cqw;align-items:center;padding:16px 20px}
@container (max-width:560px){ .hh{grid-template-columns:1fr;gap:12px;align-content:start} }
.hh-kiri{text-align:left}
.hh-jam{font-size:clamp(40px,min(36cqh,16cqw),120px);line-height:1;letter-spacing:-.02em;margin:4px 0}
.hh-tgl{font-style:italic;font-size:clamp(13px,3.6cqmin,19px)}
.hh-kanan{display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.hh-libur{border-left:2px solid var(--line);padding-left:10px;font-size:15px}
.hh-kutip{font-style:italic;color:var(--muted);font-size:13.5px;line-height:1.45}
/* pesan sopan */
.ps{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:12px;text-align:left}
@container (max-width:620px){ .ps{grid-template-columns:1fr;overflow:auto;align-content:start} }
.ps-kiri{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.ps-kiri > label,.ps-field label{display:flex;flex-direction:column;gap:4px}
.ps-kiri .inp{width:100%}
.ps-kanan{display:flex;flex-direction:column;gap:8px;min-height:0}
.ps-out{flex:1;min-height:180px;resize:none;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;font-family:var(--sans);font-size:13px;line-height:1.55}
.ps-etika{display:none;border:1px dashed var(--muted);border-radius:10px;padding:7px 10px;font-size:12.5px;font-family:var(--sans)}
/* mulai kapan */
.mk{width:100%;display:flex;flex-direction:column;gap:10px;padding:12px;text-align:left}
.mk .fk{max-width:none}
.bab-list{flex-direction:column;gap:6px}
.mk-hasil{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.mk-mulai span{display:block}
.mk-mulai b{font-weight:400;font-size:clamp(20px,7cqmin,32px)}
.mk-status{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.mk-status.merah{color:var(--fg);border-left:2px solid var(--fg);padding-left:8px}
.mk-status.kuning{color:var(--fg)}
.mk-ms div{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.mk-ms .num{color:var(--muted);font-family:var(--sans);font-size:12px}
.mk-ms b{font-weight:400;font-family:var(--sans);font-size:12.5px}
/* roda tugas */
.rt{width:100%;height:100%;display:grid;grid-template-columns:1fr 1.2fr;gap:12px;padding:12px}
@container (max-width:560px){ .rt{grid-template-columns:1fr;overflow:auto} }
.rt-kiri{display:flex;flex-direction:column;gap:8px;min-height:0}
.rt-kiri label{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;text-align:left}
.rt-kiri textarea{flex:1;min-height:70px;resize:none;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px;outline:none;font-size:13px}
.rt-kanan{display:flex;flex-direction:column;gap:8px;align-items:center;min-height:0}
.rt-roda{position:relative;width:min(100%,46cqh,300px);aspect-ratio:1}
@container (max-width:560px){ .rt-roda{width:min(80cqw,260px)} }
.rt-roda canvas{width:100%;height:100%}
.rt-pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:16px}
.rt-hasil{width:100%;overflow:auto;min-height:0;font-family:var(--sans);font-size:12.5px}
.rt-hasil div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.rt-hasil b{font-family:var(--serif);font-weight:400;font-size:14px}
/* riset kit */
.rk{width:100%;display:flex;flex-direction:column;gap:10px;padding:12px;text-align:left}
.rk .fk{max-width:none}
.rk-portal{display:flex;flex-wrap:wrap;gap:6px}
.rk-portal .chip{padding:6px 11px;font-size:12px}
.rk-out{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rk-sit{font-size:14px;line-height:1.55;padding-left:1.5em;text-indent:-1.5em;word-break:break-word}
/* paylater */
.pl-vonis{font-family:var(--sans);font-size:12.5px;line-height:1.55}
/* radar libur */
.rl{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;padding:12px;text-align:left}
.rl-list{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.rl-item{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rl-item.cuti .rl-tgl{opacity:.6}
.rl-tgl{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;height:fit-content}
.rl-tgl b{font-weight:400;font-size:20px;line-height:1.1}
.rl-tgl span{font-family:var(--sans);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rl-lw,.rl-kj{display:inline-block;margin-top:4px;font-family:var(--sans);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.rl-kj{border-style:dashed;margin-left:4px}
/* tidur & reset */
.tr{width:100%;display:flex;flex-direction:column;gap:12px;padding:12px;text-align:left}
.tr-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tr-list div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tr-list b{display:block;font-weight:400;font-size:clamp(20px,7cqmin,30px)}
.tr-list span{font-family:var(--sans);font-size:11px;color:var(--muted)}
.napas-wadah{position:relative;width:min(48cqh,60cqw,200px);aspect-ratio:1;display:grid;place-items:center}
.napas-bola{position:absolute;inset:12%;border-radius:999px;border:1.5px solid var(--fg);background:var(--soft);transform:scale(.75)}
.napas-teks{position:relative;font-style:italic;font-size:clamp(15px,5cqmin,22px)}
/* sampel */
.sp-teks{font-size:13.5px;line-height:1.55;font-style:italic;color:var(--muted);text-align:left}

.peringatan{margin-top:22px;border:1px solid var(--muted);border-radius:12px;padding:14px 16px;line-height:1.55;font-size:14px}
.peringatan b{font-weight:600}
.kaki{margin-top:50px;text-align:center;color:var(--muted);font-size:13px;font-style:italic}
</style>

<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ================= util ================= */
var P = new URLSearchParams(location.search);
var root = document.documentElement;
root.dataset.tema = (P.get("tema") === "terang") ? "terang" : "gelap";
if (P.get("bg") === "transparan") root.dataset.bg = "transparan";

function el(html){ var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function q(r, s){ return r.querySelector(s); }
function qa(r, s){ return Array.prototype.slice.call(r.querySelectorAll(s)); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function zona(){
  var o = -new Date().getTimezoneOffset() / 60;
  return o === 7 ? "WIB" : o === 8 ? "WITA" : o === 9 ? "WIT" : "GMT" + (o >= 0 ? "+" : "") + o;
}
var HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function tglPanjang(d){ return HARI[d.getDay()] + ", " + d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear(); }
function mmss(ms){
  var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), d = s % 60;
  return (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(d);
}
function simpan(k, v){ try { localStorage.setItem("tae-" + k, JSON.stringify(v)); } catch(e){} }
function muat(k, def){ try { var v = localStorage.getItem("tae-" + k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function salin(teks, tombol){
  function ok(){ var l = tombol.textContent; tombol.textContent = "Tersalin ✓"; setTimeout(function(){ tombol.textContent = l; }, 1400); }
  function cadangan(){
    var t = document.createElement("textarea"); t.value = teks; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); ok(); } catch(e){ tombol.textContent = "Salin manual"; }
    t.remove();
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(teks).then(ok, cadangan);
    else cadangan();
  } catch(e){ cadangan(); }
}

/* bunyi alarm (Web Audio, tanpa file eksternal) */
var AC = null;
function siapAudio(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch(e){}
}
function bunyi(kali){
  kali = kali || 3;
  try {
    siapAudio(); if (!AC) return;
    for (var i = 0; i < kali; i++){
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.38;
      o.type = "sine"; o.frequency.value = i % 2 ? 660 : 880;
      o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.start(t); o.stop(t + 0.34);
    }
  } catch(e){}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
}

/* ring progres SVG */
function ringSVG(){
  return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--soft)" stroke-width="2.2"/>' +
         '<circle class="arc" cx="50" cy="50" r="46" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="0"/></svg>';
}
function setRing(box, frac){ var a = q(box, ".arc"); if (a) a.setAttribute("stroke-dashoffset", (289.03 * (1 - Math.max(0, Math.min(1, frac)))).toFixed(2)); }

/* ================= widget ================= */

function jamDigital(box){
  var detik = P.get("detik") !== "0";
  box.innerHTML = '<div class="w"><div class="kecil zona"></div><div class="jd-jam num"><span class="hm"></span>' +
    (detik ? '<span class="jd-detik num"></span>' : '') + '</div><div class="jd-tgl"></div></div>';
  function upd(){
    var d = new Date();
    q(box, ".hm").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (detik) q(box, ".jd-detik").textContent = pad(d.getSeconds());
    q(box, ".jd-tgl").textContent = tglPanjang(d);
    q(box, ".zona").textContent = "Waktu " + zona();
  }
  upd(); setInterval(upd, 1000);
}

function jamAnalog(box){
  var ticks = "";
  for (var i = 0; i < 60; i++){
    var besar = i % 5 === 0;
    ticks += '<line x1="50" y1="' + (besar ? 6 : 7) + '" x2="50" y2="' + (besar ? 11 : 9) + '" stroke="' + (besar ? "var(--fg)" : "var(--muted)") +
             '" stroke-width="' + (besar ? 1.1 : 0.45) + '" stroke-linecap="round" transform="rotate(' + (i * 6) + ' 50 50)"/>';
  }
  var angka = [[12,50,19.5],[3,82,52.8],[6,50,86],[9,18,52.8]].map(function(a){
    return '<text x="' + a[1] + '" y="' + a[2] + '" text-anchor="middle" font-size="8" fill="var(--fg)" font-family="Georgia, serif">' + a[0] + '</text>';
  }).join("");
  box.innerHTML = '<div class="w"><svg class="ja-svg" viewBox="0 0 100 100">' +
    '<circle cx="50" cy="50" r="48" fill="none" stroke="var(--line)" stroke-width="0.8"/>' + ticks + angka +
    '<line class="hj" x1="50" y1="52" x2="50" y2="28" stroke="var(--fg)" stroke-width="2.4" stroke-linecap="round"/>' +
    '<line class="mn" x1="50" y1="54" x2="50" y2="17" stroke="var(--fg)" stroke-width="1.5" stroke-linecap="round"/>' +
    '<line class="dt" x1="50" y1="58" x2="50" y2="13" stroke="var(--muted)" stroke-width="0.6" stroke-linecap="round"/>' +
    '<circle cx="50" cy="50" r="1.8" fill="var(--fg)"/></svg>' +
    '<div class="kecil tgl"></div></div>';
  function upd(){
    var d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    q(box, ".hj").setAttribute("transform", "rotate(" + (h * 30) + " 50 50)");
    q(box, ".mn").setAttribute("transform", "rotate(" + (m * 6) + " 50 50)");
    q(box, ".dt").setAttribute("transform", "rotate(" + (Math.floor(s) * 6) + " 50 50)");
    q(box, ".tgl").textContent = HARI[d.getDay()] + " · " + d.getDate() + " " + BULAN[d.getMonth()] + " · " + zona();
  }
  upd(); setInterval(upd, 250);
}

function timer(box){
  var total = 10 * 60000, sisa = total, akhir = 0, jalan = false;
  box.innerHTML = '<div class="w">' +
    '<div class="baris preset"></div>' +
    '<div class="ring">' + ringSVG() + '<div><div class="angka num"></div><div class="sub kecil">Timer</div></div></div>' +
    '<div class="baris"><input class="inp num mnt" type="number" min="0" max="999" value="10" aria-label="Menit" style="width:66px"> <span class="kecil">mnt</span>' +
    '<input class="inp num dtk" type="number" min="0" max="59" value="0" aria-label="Detik" style="width:60px"> <span class="kecil">dtk</span></div>' +
    '<div class="baris"><button class="btn utama mulai">Mulai</button><button class="btn reset">Reset</button></div>' +
    '<div class="pesan"></div></div>';
  [1, 5, 10, 15, 30, 60].forEach(function(m){
    var c = el('<button class="chip">' + m + ' mnt</button>');
    c.onclick = function(){ setDurasi(m * 60000); };
    q(box, ".preset").appendChild(c);
  });
  function setDurasi(ms){
    jalan = false; total = Math.max(1000, ms); sisa = total;
    q(box, ".mnt").value = Math.floor(total / 60000); q(box, ".dtk").value = Math.floor(total / 1000) % 60;
    q(box, ".pesan").textContent = ""; render();
  }
  function dariInput(){ setDurasi(((parseInt(q(box, ".mnt").value, 10) || 0) * 60 + (parseInt(q(box, ".dtk").value, 10) || 0)) * 1000); }
  q(box, ".mnt").onchange = dariInput; q(box, ".dtk").onchange = dariInput;
  function render(){
    if (jalan) sisa = akhir - Date.now();
    q(box, ".angka").textContent = mmss(sisa);
    setRing(box, sisa / total);
    q(box, ".mulai").textContent = jalan ? "Jeda" : (sisa < total && sisa > 0 ? "Lanjut" : "Mulai");
  }
  q(box, ".mulai").onclick = function(){
    siapAudio();
    if (jalan){ sisa = akhir - Date.now(); jalan = false; }
    else { if (sisa <= 0) sisa = total; akhir = Date.now() + sisa; jalan = true; q(box, ".pesan").textContent = ""; }
    render();
  };
  q(box, ".reset").onclick = function(){ setDurasi(total); };
  setInterval(function(){
    if (!jalan) return;
    if (akhir - Date.now() <= 0){ jalan = false; sisa = 0; render(); q(box, ".pesan").textContent = "Waktu habis ⏰"; bunyi(5); }
    else render();
  }, 200);
  render();
}

function stopwatch(box){
  var mulaiPada = 0, tersimpan = 0, jalan = false, laps = [];
  box.innerHTML = '<div class="w"><div class="kecil">Stopwatch</div><div class="sw-angka num"><span class="u"></span><span class="sw-cs"></span></div>' +
    '<div class="baris"><button class="btn utama mulai">Mulai</button><button class="btn lap">Putaran</button><button class="btn reset">Reset</button></div>' +
    '<div class="laps"></div></div>';
  function waktu(){ return tersimpan + (jalan ? Date.now() - mulaiPada : 0); }
  function fmt(ms){ var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s % 60); }
  function render(){
    var ms = waktu();
    q(box, ".u").textContent = fmt(ms);
    q(box, ".sw-cs").textContent = "." + pad(Math.floor(ms % 1000 / 10));
    q(box, ".mulai").textContent = jalan ? "Jeda" : (ms ? "Lanjut" : "Mulai");
  }
  function renderLaps(){
    q(box, ".laps").innerHTML = laps.map(function(l, i){
      return '<div><span>Putaran ' + (laps.length - i) + '</span><span class="num">+' + fmt(l.selisih) + "." + pad(Math.floor(l.selisih % 1000 / 10)) + '   ' + fmt(l.total) + '</span></div>';
    }).join("");
  }
  q(box, ".mulai").onclick = function(){ if (jalan){ tersimpan = waktu(); jalan = false; } else { mulaiPada = Date.now(); jalan = true; } render(); };
  q(box, ".lap").onclick = function(){ var t = waktu(); if (!t) return; var prev = laps.length ? laps[0].total : 0; laps.unshift({ total: t, selisih: t - prev }); renderLaps(); };
  q(box, ".reset").onclick = function(){ jalan = false; tersimpan = 0; laps = []; renderLaps(); render(); };
  (function loop(){ if (jalan) render(); requestAnimationFrame(loop); })();
  render();
}

/* kalkulator: parser sendiri, tanpa eval */
function hitungEkspresi(s){
  var tok = s.match(/\d+(\.\d+)?|[+\-*/%()]/g) || [], i = 0;
  function lihat(){ return tok[i]; } function ambil(){ return tok[i++]; }
  function faktor(){
    var t = ambil(), v;
    if (t === "-") return -faktor();
    if (t === "+") return faktor();
    if (t === "("){ v = ekspr(); if (lihat() === ")") ambil(); }
    else { v = parseFloat(t); if (isNaN(v)) throw new Error("x"); }
    while (lihat() === "%"){ ambil(); v = v / 100; }
    return v;
  }
  function term(){ var v = faktor(); while (lihat() === "*" || lihat() === "/"){ var o = ambil(), b = faktor(); v = o === "*" ? v * b : v / b; } return v; }
  function ekspr(){ var v = term(); while (lihat() === "+" || lihat() === "-"){ var o = ambil(), b = term(); v = o === "+" ? v + b : v - b; } return v; }
  var hasil = ekspr();
  if (i < tok.length || !isFinite(hasil)) throw new Error("x");
  return hasil;
}
function fmtAngka(n){
  if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-9 && n !== 0)) return n.toExponential(6).replace(".", ",");
  return n.toLocaleString("id-ID", { maximumFractionDigits: 10 });
}
function tampilEks(s){ return s.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−").replace(/\./g, ","); }

function kalkulator(box){
  var eks = "", baruSelesai = false;
  var tombol = [["C","fn"],["( )","fn"],["%","op"],["/","op"],["7"],["8"],["9"],["*","op"],["4"],["5"],["6"],["-","op"],["1"],["2"],["3"],["+","op"],["⌫","fn"],["0"],[".",""],["=","sama"]];
  box.innerHTML = '<div class="w" style="padding:0"><div class="kal"><div class="kal-layar"><div class="kal-eks"></div><div class="kal-hasil num">0</div></div><div class="kal-grid"></div></div></div>';
  var grid = q(box, ".kal-grid");
  tombol.forEach(function(t){
    var label = t[0] === "*" ? "×" : t[0] === "/" ? "÷" : t[0] === "-" ? "−" : t[0] === "." ? "," : t[0];
    var b = el('<button class="' + (t[1] || "") + '" aria-label="' + label + '">' + label + '</button>');
    b.onclick = function(){ tekan(t[0]); };
    grid.appendChild(b);
  });
  function pratinjau(){
    try { return eks ? fmtAngka(hitungEkspresi(eks)) : "0"; } catch(e){ return null; }
  }
  function render(final){
    q(box, ".kal-eks").textContent = tampilEks(eks) || " ";
    if (final !== undefined){ q(box, ".kal-hasil").textContent = final; return; }
    var p = pratinjau(); if (p !== null) q(box, ".kal-hasil").textContent = p;
  }
  function tekan(k){
    if (k === "C"){ eks = ""; render("0"); return; }
    if (k === "⌫"){ eks = eks.slice(0, -1); render(); return; }
    if (k === "="){
      try { var h = hitungEkspresi(eks); eks = String(+h.toPrecision(12)); baruSelesai = true; render(fmtAngka(h)); q(box, ".kal-eks").textContent = " "; }
      catch(e){ render("Error"); }
      return;
    }
    if (k === "( )"){
      var buka = (eks.match(/\(/g) || []).length, tutup = (eks.match(/\)/g) || []).length;
      k = (buka > tutup && /[\d)%]$/.test(eks)) ? ")" : "(";
    }
    if (baruSelesai && /[\d.(]/.test(k)) eks = "";
    baruSelesai = false;
    if (/[+\-*/]/.test(k) && /[+\-*/]$/.test(eks) && !(k === "-" && /[*/]$/.test(eks))) eks = eks.slice(0, -1);
    if (k === "."){ var seg = eks.split(/[+\-*/()%]/).pop(); if (seg.indexOf(".") >= 0) return; if (!seg) k = "0."; }
    if (eks.length > 60) return;
    eks += k; render();
  }
  box.tabIndex = 0;
  box.addEventListener("keydown", function(e){
    var k = e.key, peta = { "Enter": "=", "=": "=", "Backspace": "⌫", "Escape": "C", ",": ".", "x": "*", "X": "*" };
    if (peta[k]) k = peta[k];
    if (/^[\d.+\-*/%()=]$/.test(k) || k === "⌫" || k === "C"){ e.preventDefault(); tekan(k === "(" || k === ")" ? k : k); }
  });
}

function kalender(box){
  var now = new Date(), th = now.getFullYear(), bl = now.getMonth();
  box.innerHTML = '<div class="w" style="padding:0"><div class="kl"><div class="kl-head"><div class="kl-judul"></div>' +
    '<div class="kl-nav"><button class="prev" aria-label="Bulan sebelumnya">‹</button><button class="today" aria-label="Bulan ini">•</button><button class="next" aria-label="Bulan berikutnya">›</button></div></div>' +
    '<div class="kl-grid"></div></div></div>';
  function render(){
    var hariIni = new Date();
    q(box, ".kl-judul").textContent = BULAN[bl] + " " + th;
    var g = q(box, ".kl-grid"), html = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(function(h){ return '<div class="h">' + h + '</div>'; }).join("");
    var awal = new Date(th, bl, 1), geser = (awal.getDay() + 6) % 7, mulai = new Date(th, bl, 1 - geser);
    for (var i = 0; i < 42; i++){
      var d = new Date(mulai.getFullYear(), mulai.getMonth(), mulai.getDate() + i), cls = "d num";
      if (d.getMonth() !== bl) cls += " lain";
      if (d.getDay() === 0) cls += " mg";
      if (d.toDateString() === hariIni.toDateString()) cls += " ini";
      html += '<div class="' + cls + '">' + d.getDate() + '</div>';
    }
    g.innerHTML = html;
  }
  q(box, ".prev").onclick = function(){ bl--; if (bl < 0){ bl = 11; th--; } render(); };
  q(box, ".next").onclick = function(){ bl++; if (bl > 11){ bl = 0; th++; } render(); };
  q(box, ".today").onclick = function(){ var n = new Date(); th = n.getFullYear(); bl = n.getMonth(); render(); };
  render();
  var tgl = new Date().getDate();
  setInterval(function(){ if (new Date().getDate() !== tgl){ tgl = new Date().getDate(); render(); } }, 60000);
}

function progresWaktu(box){
  box.innerHTML = '<div class="w"><div class="pg"></div></div>';
  function render(){
    var d = new Date(), t = d.getTime();
    var awalHari = new Date(d.getFullYear(), d.getMonth(), d.getDate()), akhirHari = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    var gs = (d.getDay() + 6) % 7, awalMg = new Date(d.getFullYear(), d.getMonth(), d.getDate() - gs), akhirMg = new Date(d.getFullYear(), d.getMonth(), d.getDate() - gs + 7);
    var awalBl = new Date(d.getFullYear(), d.getMonth(), 1), akhirBl = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    var awalTh = new Date(d.getFullYear(), 0, 1), akhirTh = new Date(d.getFullYear() + 1, 0, 1);
    function pr(a, b){ return (t - a) / (b - a) * 100; }
    var rows = [
      ["Hari ini", pr(awalHari, akhirHari)],
      ["Minggu ini", pr(awalMg, akhirMg)],
      [BULAN[d.getMonth()], pr(awalBl, akhirBl)],
      ["Tahun " + d.getFullYear(), pr(awalTh, akhirTh)]
    ];
    q(box, ".pg").innerHTML = rows.map(function(r){
      return '<div class="pg-row"><div class="pg-top"><span class="pg-lbl">' + r[0] + '</span><span class="kecil num">' + r[1].toFixed(1).replace(".", ",") + '%</span></div>' +
             '<div class="pg-bar"><i style="width:' + r[1].toFixed(2) + '%"></i></div></div>';
    }).join("");
  }
  render(); setInterval(render, 30000);
}

function hitungMundur(box, demo){
  var tgl = P.get("tgl"), label = P.get("label");
  if (demo && !tgl){ var d0 = new Date(); d0.setDate(d0.getDate() + 23); tgl = d0.getFullYear() + "-" + pad(d0.getMonth() + 1) + "-" + pad(d0.getDate()); label = "UAS Semester Ganjil"; }
  var target = tgl ? new Date(tgl.length <= 10 ? tgl + "T00:00:00" : tgl) : null;
  if (!target || isNaN(target)){ return formMundur(box); }
  label = label || "Hitung Mundur";
  box.innerHTML = '<div class="w"><div class="hm-label"></div><div class="hm-besar num"></div><div class="kecil detail"></div><div class="kecil tgl"></div>' +
    (demo ? '<button class="chip atur" style="margin-top:4px">Atur tanggalmu</button>' : '') + '</div>';
  q(box, ".hm-label").textContent = label;
  q(box, ".tgl").textContent = tglPanjang(target) + (tgl.length > 10 ? " · " + pad(target.getHours()) + ":" + pad(target.getMinutes()) : "");
  if (demo) q(box, ".atur").onclick = function(){ formMundur(box); };
  function render(){
    var now = new Date(), hari0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), tgt0 = new Date(target.getFullYear(), target.getMonth(), target.getDate());
    var selisihHari = Math.round((tgt0 - hari0) / 86400000), ms = target - now;
    var besar, detail;
    if (selisihHari > 0){
      besar = "H-" + selisihHari;
      var j = Math.floor(ms / 3600000);
      detail = selisihHari === 1 ? "Besok · " + j + " jam lagi" : Math.floor(ms / 86400000) + " hari " + (j % 24) + " jam lagi";
    } else if (selisihHari === 0){
      besar = "Hari ini"; detail = ms > 0 ? Math.floor(ms / 3600000) + " jam " + Math.floor(ms % 3600000 / 60000) + " menit lagi" : "Semangat!";
    } else { besar = "H+" + (-selisihHari); detail = "Sudah lewat " + (-selisihHari) + " hari"; }
    q(box, ".hm-besar").textContent = besar; q(box, ".detail").textContent = detail;
  }
  render(); setInterval(render, 30000);
}

/* --- kalkulator ilmiah: parser sendiri dengan fungsi, pangkat, faktorial --- */
function hitungIlmiah(s, deg){
  var re = /\d+(\.\d+)?|asin|acos|atan|sin|cos|tan|ln|log|√|π|e|[+\-*/^()!%]/g, mentah = s.match(re) || [], tok = [];
  if (mentah.join("") !== s.replace(/\s+/g, "")) throw new Error("x");
  function nilaiAkhir(t){ return /^[\d.]/.test(t) || t === ")" || t === "π" || t === "e" || t === "!" || t === "%"; }
  function nilaiAwal(t){ return /^[\d.]/.test(t) || t === "(" || t === "π" || t === "e" || t === "√" || /^[a-z]{2,}$/.test(t); }
  mentah.forEach(function(t){ if (tok.length && nilaiAkhir(tok[tok.length - 1]) && nilaiAwal(t)) tok.push("*"); tok.push(t); });
  var i = 0, R = Math.PI / 180;
  function lihat(){ return tok[i]; } function ambil(){ return tok[i++]; }
  function fungsi(f, x){
    switch (f){
      case "sin": return deg ? (x % 180 === 0 ? 0 : Math.sin(x * R)) : Math.sin(x);
      case "cos": return deg ? ((x - 90) % 180 === 0 ? 0 : Math.cos(x * R)) : Math.cos(x);
      case "tan": if (deg && (x - 90) % 180 === 0) throw new Error("x"); return deg ? (x % 180 === 0 ? 0 : Math.tan(x * R)) : Math.tan(x);
      case "asin": return deg ? Math.asin(x) / R : Math.asin(x);
      case "acos": return deg ? Math.acos(x) / R : Math.acos(x);
      case "atan": return deg ? Math.atan(x) / R : Math.atan(x);
      case "ln": return Math.log(x);
      case "log": return Math.log10(x);
      case "√": return Math.sqrt(x);
    }
  }
  function primer(){
    var t = ambil(), v;
    if (t === undefined) throw new Error("x");
    if (t === "("){ v = ekspr(); if (lihat() === ")") ambil(); return v; }
    if (t === "π") return Math.PI;
    if (t === "e") return Math.E;
    if (t === "√" || /^[a-z]{2,}$/.test(t)){
      var arg;
      if (lihat() === "("){ ambil(); arg = ekspr(); if (lihat() === ")") ambil(); }
      else arg = postfix();
      return fungsi(t, arg);
    }
    v = parseFloat(t); if (isNaN(v)) throw new Error("x"); return v;
  }
  function postfix(){
    var v = primer();
    while (lihat() === "!" || lihat() === "%"){
      if (ambil() === "%") v = v / 100;
      else { if (v < 0 || v > 170 || v !== Math.floor(v)) throw new Error("x"); var f = 1; for (var k = 2; k <= v; k++) f *= k; v = f; }
    }
    return v;
  }
  function pangkat(){ var b = postfix(); if (lihat() === "^"){ ambil(); return Math.pow(b, unary()); } return b; }
  function unary(){ if (lihat() === "-"){ ambil(); return -unary(); } if (lihat() === "+"){ ambil(); return unary(); } return pangkat(); }
  function term(){ var v = unary(); while (lihat() === "*" || lihat() === "/"){ var o = ambil(), b = unary(); v = o === "*" ? v * b : v / b; } return v; }
  function ekspr(){ var v = term(); while (lihat() === "+" || lihat() === "-"){ var o = ambil(), b = term(); v = o === "+" ? v + b : v - b; } return v; }
  var h = ekspr();
  if (i < tok.length || !isFinite(h)) throw new Error("x");
  if (Math.abs(h) < 1e-12) h = 0;
  return +h.toPrecision(12);
}
function kalkulatorIlmiah(box){
  var eks = "", deg = true, selesaiTadi = false;
  var T = [
    ["DEG","mode"],["sin⁻¹","fn","asin("],["cos⁻¹","fn","acos("],["tan⁻¹","fn","atan("],["C","fn"],
    ["sin","fn","sin("],["cos","fn","cos("],["tan","fn","tan("],["ln","fn","ln("],["log","fn","log("],
    ["x²","fn","^2"],["xʸ","fn","^"],["√","fn","√("],["(","fn"],[")","fn"],
    ["7"],["8"],["9"],["÷","op","/"],["⌫","fn"],
    ["4"],["5"],["6"],["×","op","*"],["n!","fn","!"],
    ["1"],["2"],["3"],["−","op","-"],["π","fn"],
    ["0"],[",","",  "."],["e","fn"],["+","op"],["=","sama"]
  ];
  box.innerHTML = '<div class="w" style="padding:0"><div class="ki"><div class="kal-layar"><div class="kal-eks"></div><div class="kal-hasil num">0</div></div><div class="ki-grid"></div></div></div>';
  T.forEach(function(t){
    var b = el('<button class="' + (t[1] || "") + '" aria-label="' + t[0] + '">' + t[0] + '</button>');
    b.onclick = function(){ tekan(t); };
    q(box, ".ki-grid").appendChild(b);
  });
  function tampil(s){ return s.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−").replace(/\./g, ",").replace(/asin/g, "sin⁻¹").replace(/acos/g, "cos⁻¹").replace(/atan/g, "tan⁻¹"); }
  function fmt(n){ return Math.abs(n) >= 1e15 || (n !== 0 && Math.abs(n) < 1e-9) ? n.toExponential(6).replace(".", ",") : n.toLocaleString("id-ID", { maximumFractionDigits: 10 }); }
  function render(akhir){
    q(box, ".kal-eks").textContent = tampil(eks) || " ";
    if (akhir !== undefined){ q(box, ".kal-hasil").textContent = akhir; return; }
    try { if (eks) q(box, ".kal-hasil").textContent = fmt(hitungIlmiah(eks, deg)); } catch(e){}
  }
  function tekan(t){
    var k = t[0], isi = t[2] !== undefined ? t[2] : t[0];
    if (k === "DEG" || k === "RAD"){ deg = !deg; var b = q(box, ".mode"); b.textContent = deg ? "DEG" : "RAD"; render(); return; }
    if (k === "C"){ eks = ""; render("0"); return; }
    if (k === "⌫"){ eks = eks.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|√\(|.)$/, ""); render(); return; }
    if (k === "="){
      try { var h = hitungIlmiah(eks, deg); render(fmt(h)); var s = String(h); eks = /e/.test(s) ? s.replace(/e\+?/, "*10^") : s; q(box, ".kal-eks").textContent = " "; selesaiTadi = true; }
      catch(e){ render("Error"); }
      return;
    }
    if (selesaiTadi && /^[\d.(πe√a-z]/.test(isi)) eks = "";
    selesaiTadi = false;
    if (/^[+*/^]$/.test(isi) && /[+\-*/^]$/.test(eks)) eks = eks.slice(0, -1);
    if (isi === "."){ var seg = eks.split(/[^\d.]/).pop(); if (seg.indexOf(".") >= 0) return; if (!seg) isi = "0."; }
    if (eks.length > 80) return;
    eks += isi; render();
  }
  box.tabIndex = 0;
  box.addEventListener("keydown", function(e){
    var m = { "Enter": ["="], "=": ["="], "Backspace": ["⌫"], "Escape": ["C"], ",": [",", "", "."], ".": [",", "", "."], "^": ["xʸ", "fn", "^"], "!": ["n!", "fn", "!"] };
    if (m[e.key]){ e.preventDefault(); tekan(m[e.key]); }
    else if (/^[\d+\-*/()]$/.test(e.key)){ e.preventDefault(); tekan([e.key, "", e.key]); }
  });
}

  var n = list.map(function(p){ return p.depan.length ? p.akhir + ", " + inisial(p.depan) : p.akhir; });
  if (!n.length) return "";
  if (n.length === 1) return n[0];
  if (n.length <= 20) return n.slice(0, -1).join(", ") + ", & " + n[n.length - 1];
  return n.slice(0, 19).join(", ") + ", . . . " + n[n.length - 1];
}
function penulisIEEE(list){
  var n = list.map(function(p){ return (p.depan.length ? inisial(p.depan) + " " : "") + p.akhir; });
  if (!n.length) return "";

  if (n.length === 2) return n[0] + " and " + n[1];

}

  } else if (jenis === "buku"){

      '<div class="fk-row"><label class="kecil">Jumlah populasi (N)<input class="inp num N" type="number" min="1" value="1200"></label><label class="kecil">Margin of error (e)<select class="inp e"><option value="0.01">1%</option><option value="0.05">5%</option><option value="0.1" selected>10%</option></select></label></div></div>' +
    '<div class="pn-lem" style="display:none;flex-direction:column;gap:8px">' +
      '<div class="fk-row"><label class="kecil">Tingkat kepercayaan<select class="inp z"><option value="1.645">90% (Z = 1,645)</option><option value="1.96" selected>95% (Z = 1,96)</option><option value="2.576">99% (Z = 2,576)</option></select></label><label class="kecil">Presisi (d)<select class="inp d"><option value="0.05">5%</option><option value="0.1" selected>10%</option></select></label></div>' +
      '<div class="fk-row"><label class="kecil">Proporsi (p)<input class="inp num p" type="number" step="0.01" min="0.01" max="0.99" value="0.5"></label><label class="kecil">Populasi N (kosongkan jika tak diketahui)<input class="inp num NL" type="number" min="1"></label></div></div>' +
    '<div class="fk-hasil"><div><div class="kecil">Sampel minimal</div><div class="fk-besar num n">–</div></div><div class="rinci rumus" style="text-align:right;max-width:60%"></div></div>' +
    '<div class="sp-teks"></div><button class="chip salin" style="align-self:flex-start">Salin kalimat Bab 3</button>' +
    '<div class="catatan">Selalu dibulatkan ke atas. Rumus Slovin sering dikritik secara metodologis, jadi ikuti rumus yang disetujui dosen pembimbingmu.</div>' +
    '</div></div>';
  var mode = "slovin", kalimat = "";
  qa(box, ".tab").forEach(function(b){ b.onclick = function(){ mode = b.dataset.t; qa(box, ".tab").forEach(function(x){ x.classList.toggle("on", x === b); }); q(box, ".pn-slovin").style.display = mode === "slovin" ? "flex" : "none"; q(box, ".pn-lem").style.display = mode === "slovin" ? "none" : "flex"; hitung(); }; });
  function f(x, k){ return fmtDes(x, k === undefined ? 2 : k); }
  function hitung(){
    var n, rumus;
    if (mode === "slovin"){
      var N = parseFloat(q(box, ".N").value), e = parseFloat(q(box, ".e").value);
      if (!(N > 0)){ q(box, ".n").textContent = "–"; return; }
      var raw = N / (1 + N * e * e); n = Math.ceil(raw - 1e-9);
      rumus = "n = N / (1 + N·e²)<br>= " + f(N, 0) + " / (1 + " + f(N, 0) + " × " + f(e, 2) + "²)<br>= " + f(raw) + " → " + n;
      kalimat = "Penentuan jumlah sampel menggunakan rumus Slovin, n = N / (1 + Ne²), dengan jumlah populasi (N) sebanyak " + f(N, 0) + " dan margin of error (e) sebesar " + f(e * 100, 0) + "%. Hasil perhitungan diperoleh n = " + f(raw) + ", yang dibulatkan menjadi " + n + " responden.";
    } else {
      var Z = parseFloat(q(box, ".z").value), d = parseFloat(q(box, ".d").value), p = parseFloat(q(box, ".p").value), NL = parseFloat(q(box, ".NL").value);
      if (!(p > 0 && p < 1)){ q(box, ".n").textContent = "–"; return; }
      var atas = Z * Z * p * (1 - p), raw2;
      if (NL > 0){ raw2 = NL * atas / (d * d * (NL - 1) + atas); rumus = "n = N·Z²·p(1−p) / (d²(N−1) + Z²·p(1−p))<br>= " + f(raw2) + " → " + Math.ceil(raw2 - 1e-9); }
      else { raw2 = atas / (d * d); rumus = "n = Z²·p(1−p) / d²<br>= " + f(Z, 3) + "² × " + f(p) + " × " + f(1 - p) + " / " + f(d) + "²<br>= " + f(raw2) + " → " + Math.ceil(raw2 - 1e-9); }
      n = Math.ceil(raw2 - 1e-9);
      kalimat = "Penentuan jumlah sampel menggunakan rumus Lemeshow" + (NL > 0 ? " untuk populasi yang diketahui (N = " + f(NL, 0) + ")" : " karena jumlah populasi tidak diketahui") + ", dengan tingkat kepercayaan " + q(box, ".z").selectedOptions[0].textContent.split(" ")[0] + " (Z = " + f(Z, Z === 1.96 ? 2 : 3) + "), proporsi (p) " + f(p) + ", dan presisi (d) " + f(d * 100, 0) + "%. Hasil perhitungan diperoleh n = " + f(raw2) + ", yang dibulatkan menjadi " + n + " responden.";
    }
    q(box, ".n").textContent = n.toLocaleString("id-ID"); q(box, ".rumus").innerHTML = rumus; q(box, ".sp-teks").textContent = kalimat;
  }
  qa(box, "input, select").forEach(function(i){ i.oninput = hitung; i.onchange = hitung; });
  q(box, ".salin").onclick = function(){ if (kalimat) salin(kalimat, this); };
  hitung();
}

}
